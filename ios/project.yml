name: HNCRevision
options:
  bundleIdPrefix: net.estopia
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  RevisionCore:
    path: RevisionCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    # Simulator builds sign ad-hoc so the app loads without a developer account;
    # device builds use the team's automatic signing.
    CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: "-"
    CODE_SIGN_IDENTITY[sdk=iphoneos*]: "Apple Development"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: LQCQTAV3UW
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES

targets:
  HNCRevision:
    type: application
    platform: iOS
    sources:
      - path: HNCRevision
      # The site's data scripts, shared with the Android app (refresh with shared/update-data.sh).
      - path: ../shared/data/cards.js
        buildPhase: resources
        group: BundledData
      - path: ../shared/data/quiz.js
        buildPhase: resources
        group: BundledData
      - path: ../shared/data/vlsm.js
        buildPhase: resources
        group: BundledData
    dependencies:
      - package: RevisionCore
      - target: HNCRevisionWidget
    # URL scheme for hncrevision://card/<id> (widget and links); everything else is generated from INFOPLIST_KEY_*.
    info:
      path: HNCRevision/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: net.estopia.hncrevision
            CFBundleURLSchemes: [hncrevision]
    # The App Group holds the saved state so the widget can read its snapshot.
    entitlements:
      path: HNCRevision/HNCRevision.entitlements
      properties:
        com.apple.security.application-groups: [group.net.estopia.hncrevision]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.estopia.hncrevision
        PRODUCT_NAME: HNCRevision
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: HNC Revision
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic

  # Home screen widget: due count, streak and card of the day (reads the snapshot the app writes to the App Group).
  HNCRevisionWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: HNCRevisionWidget
    dependencies:
      - package: RevisionCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: HNCRevisionWidget/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: HNCRevisionWidget/HNCRevisionWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.net.estopia.hncrevision]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.estopia.hncrevision.widget
        PRODUCT_NAME: HNCRevisionWidget
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: HNC Revision
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

schemes:
  HNCRevision:
    build:
      targets:
        HNCRevision: all
    run:
      config: Debug
    archive:
      config: Release
